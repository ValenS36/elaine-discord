[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "elaine-discord"
version = "2.0.0"
description = "Modular Discord companion, persistent reminders and personal ledger"
requires-python = ">=3.12"
dependencies = [
  "discord.py>=2.7,<3", "httpx>=0.28,<0.29", "python-dotenv>=1.2,<2",
  "SQLAlchemy[asyncio]>=2.0,<2.2", "aiosqlite>=0.20,<1", "alembic>=1.13,<2", "pydantic>=2.9,<3"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.8,<1"]

[project.scripts]
elaine = "elaine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
